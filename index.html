.btn:active{transform:scale(.97)}
.btn:hover,.btn:focus-visible{border-color:var(--green);box-shadow:0 0 18px rgba(125,255,26,.55);outline:none}
.btn svg,.btn img{width:30px;height:30px;flex:none;fill:var(--green);border-radius:50%}
.btn span{flex:1}
.btn .go{width:18px;height:18px;fill:var(--purple2);border-radius:0}
.btn.main{background:linear-gradient(90deg,#5b10a0,#a020f0);border-color:var(--green)}
.btn.main svg{fill:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid .btn{margin:0;flex-direction:column;justify-content:center;gap:6px;text-align:center;font-size:16px;min-height:88px;padding:12px 8px}
.share{background:transparent;border-color:var(--green);justify-content:center;margin-top:26px}

document.getElementById("links").innerHTML = html;

/* Share button: phone share sheet, or copy the link */
const shareBtn = document.getElementById("share");
const toast = document.getElementById("toast");
const pageUrl = "https://mrjsfinancialai-arch.github.io/links/";
shareBtn.innerHTML = svg(I.share) + "<span>Share this page</span>";
function showToast(t){ toast.textContent = t; toast.classList.add("show"); setTimeout(()=>toast.classList.remove("show"), 2200); }
async function copyLink(){
  try { await navigator.clipboard.writeText(pageUrl); showToast("Link copied! ✅"); }
  catch(e){ const ta=document.createElement("textarea"); ta.value=pageUrl; ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); showToast("Link copied! ✅"); }catch(_){ prompt("Copy this link:", pageUrl); } ta.remove(); }
}
shareBtn.addEventListener("click", async () => {
  if (navigator.share) {
    try { await navigator.share({title:"Killamon | Cosmic Blaze Co.", text:"Check out my links 👽", url:pageUrl}); return; }
    catch(e){ if (e && e.name === "AbortError") return; }
  }
  copyLink();
});
</script>
